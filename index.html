<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOKI AI - Personal Android AI Assistant (Web Simulator)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spinDual1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinDual2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .neon-border {
      border: 1px solid rgba(0, 245, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.15);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-[#060913] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased font-sans">

  <!-- Mobile Frame Container -->
  <div class="relative w-full max-w-[420px] h-[860px] bg-[#0A0F1D] border-4 border-slate-800 rounded-[44px] shadow-[0_0_50px_rgba(0,245,255,0.15)] flex flex-col overflow-hidden">
    
    <!-- Phone Notch / Status Bar -->
    <div class="w-full bg-[#060913] pt-3 pb-2 px-6 flex justify-between items-center z-20 text-xs font-semibold text-slate-400">
      <span id="statusBarTime">09:41</span>
      <div class="w-24 h-4 bg-slate-900 rounded-full flex items-center justify-center">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-800 mr-2"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#00F5FF]"></div>
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="text-[10px]">5G</span>
        <span id="statusBarBattery">98%</span>
      </div>
    </div>

    <!-- Active Screen Container -->
    <div id="screenContainer" class="flex-1 overflow-y-auto p-5 pb-24 relative flex flex-col">
      
      <!-- Screen 1: Home View -->
      <div id="screenHome" class="flex flex-col items-center flex-1">
        <!-- Top bar -->
        <div class="w-full flex justify-between items-center mb-4">
          <div class="flex items-center space-x-2">
            <div class="w-2.5 h-2.5 rounded-full bg-[#00F5FF] shadow-[0_0_8px_#00F5FF]"></div>
            <span class="font-extrabold tracking-widest text-[#00F5FF] text-base">DOKI AI</span>
          </div>
          <div class="flex space-x-2">
            <button onclick="switchScreen('screenHistory')" title="History" class="p-1.5 rounded-full bg-slate-800/60 hover:bg-slate-700 text-slate-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
            <button onclick="switchScreen('screenMemory')" title="Memory" class="p-1.5 rounded-full bg-slate-800/60 hover:bg-slate-700 text-slate-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </button>
            <button onclick="switchScreen('screenSettings')" title="Settings" class="p-1.5 rounded-full bg-slate-800/60 hover:bg-slate-700 text-slate-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
          </div>
        </div>

        <!-- Greeting Header -->
        <div class="w-full text-left mb-4">
          <h1 id="greetingText" class="text-2xl font-bold text-white tracking-tight">Hello, I'm DOKI.</h1>
          <p id="dateText" class="text-xs text-slate-400 font-medium">Friday, November 6</p>
        </div>

        <!-- Wake Word Pill -->
        <div class="px-3.5 py-1.5 rounded-full bg-[#0F172A] border border-cyan-500/30 flex items-center space-x-2 mb-6">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span class="text-xs text-slate-300">Listening for <strong class="text-[#00F5FF]">"Hey DOKI"</strong></span>
        </div>

        <!-- Center Animated Canvas Orb -->
        <div class="relative w-56 h-56 flex items-center justify-center my-auto cursor-pointer" onclick="triggerVoiceSession()">
          <canvas id="orbCanvas" width="220" height="220" class="rounded-full"></canvas>
          <div class="absolute bottom-2 text-[11px] text-cyan-300/70 font-mono tracking-wider">TAP ORB TO SPEAK</div>
        </div>

        <!-- Waveform canvas -->
        <div class="w-full h-8 my-2">
          <canvas id="waveCanvas" width="360" height="32" class="w-full h-full"></canvas>
        </div>

        <!-- Quick prompt chips -->
        <div class="w-full flex space-x-2 overflow-x-auto py-2 mb-3 scrollbar-none text-xs">
          <button onclick="handleQuickPrompt('Turn on flashlight')" class="shrink-0 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300">🔦 Flashlight</button>
          <button onclick="handleQuickPrompt('What is my battery level?')" class="shrink-0 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300">🔋 Battery</button>
          <button onclick="handleQuickPrompt('Set alarm for 7:00 AM')" class="shrink-0 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300">⏰ Set Alarm</button>
          <button onclick="handleQuickPrompt('ಹಲೋ ಡೋಕಿ, ಹೇಗಿದ್ದೀಯ?')" class="shrink-0 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-cyan-300">ಕನ್ನಡ</button>
          <button onclick="handleQuickPrompt('नमस्ते डोकी, आज का दिन कैसा रहेगा?')" class="shrink-0 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-purple-300">हिन्दी</button>
        </div>

        <!-- Text Input Bar -->
        <div class="w-full relative">
          <input id="textInput" type="text" placeholder="Ask DOKI anything or command device..." 
                 class="w-full bg-slate-900/90 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#00F5FF]">
          <button onclick="submitTextInput()" class="absolute right-2 top-2 p-1.5 bg-[#00F5FF] rounded-xl text-slate-950 font-bold hover:opacity-90">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </div>
      </div>

      <!-- Screen 2: Voice Active Overlay -->
      <div id="screenVoice" class="hidden flex-col items-center flex-1">
        <div class="w-full flex justify-between items-center mb-6">
          <span id="voiceStatusTitle" class="text-base font-bold text-[#00F5FF]">Listening...</span>
          <button onclick="switchScreen('screenHome')" class="p-1 rounded-full bg-slate-800 text-slate-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="relative w-56 h-56 flex items-center justify-center my-4">
          <canvas id="voiceOrbCanvas" width="220" height="220" class="rounded-full"></canvas>
        </div>

        <div class="w-full my-3">
          <canvas id="voiceWaveCanvas" width="360" height="36" class="w-full h-full"></canvas>
        </div>

        <!-- Live transcript box -->
        <div class="w-full glass-card rounded-2xl p-4 my-2 text-left">
          <div class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1">Transcript</div>
          <p id="voiceTranscript" class="text-sm text-slate-200 min-h-[24px]">"Listening to your voice..."</p>
        </div>

        <!-- Live AI response box -->
        <div id="voiceResponseCard" class="w-full glass-card rounded-2xl p-4 my-2 text-left border-l-4 border-l-[#9D4EDD]">
          <div class="text-[11px] font-bold text-purple-400 uppercase tracking-wider mb-1">DOKI Response</div>
          <p id="voiceResponseText" class="text-sm text-slate-100">Ready.</p>
          <div id="voiceToolBadge" class="mt-2 text-xs text-emerald-400 font-mono hidden">✓ Tool Executed</div>
        </div>
      </div>

      <!-- Screen 3: Memory Screen -->
      <div id="screenMemory" class="hidden flex-col flex-1">
        <div class="w-full flex items-center justify-between mb-4">
          <button onclick="switchScreen('screenHome')" class="text-cyan-400 flex items-center text-xs">‹ Back</button>
          <h2 class="font-bold text-base text-white">Personal Memory</h2>
          <button onclick="addSampleMemory()" class="text-cyan-400 text-xs font-bold">+ Add</button>
        </div>
        <div id="memoryList" class="flex flex-col space-y-2 text-left overflow-y-auto">
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- Screen 4: History Screen -->
      <div id="screenHistory" class="hidden flex-col flex-1">
        <div class="w-full flex items-center justify-between mb-4">
          <button onclick="switchScreen('screenHome')" class="text-cyan-400 flex items-center text-xs">‹ Back</button>
          <h2 class="font-bold text-base text-white">History</h2>
          <button onclick="clearHistory()" class="text-rose-400 text-xs">Clear</button>
        </div>
        <div id="historyList" class="flex flex-col space-y-2 text-left overflow-y-auto">
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- Screen 5: Settings Screen -->
      <div id="screenSettings" class="hidden flex-col flex-1 text-left">
        <div class="w-full flex items-center justify-between mb-4">
          <button onclick="switchScreen('screenHome')" class="text-cyan-400 flex items-center text-xs">‹ Back</button>
          <h2 class="font-bold text-base text-white">Settings</h2>
          <span></span>
        </div>
        <div class="space-y-4 text-xs">
          <div class="glass-card p-3 rounded-xl">
            <label class="block font-bold text-slate-300 mb-1">Preferred Language</label>
            <select id="prefLang" onchange="saveLanguage()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
              <option value="en-US">English (US)</option>
              <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
              <option value="hi-IN">Hindi (हिन्दी)</option>
            </select>
          </div>

          <div class="glass-card p-3 rounded-xl">
            <label class="block font-bold text-slate-300 mb-1">Gemini AI Model</label>
            <select class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
              <option>gemini-1.5-flash (Fast & Low Latency)</option>
              <option>gemini-1.5-pro (High Intelligence)</option>
              <option>gemini-2.0-flash</option>
            </select>
          </div>

          <div class="glass-card p-3 rounded-xl">
            <label class="block font-bold text-slate-300 mb-1">Hey DOKI Sensitivity</label>
            <input type="range" min="10" max="100" value="50" class="w-full accent-cyan-400">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1"><span>Low (Quiet)</span><span>Medium</span><span>High</span></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Floating Docked Microphone Button -->
    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-30">
      <button id="floatingMicBtn" onclick="triggerVoiceSession()" 
              class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#00F5FF] to-[#9D4EDD] p-0.5 shadow-[0_0_25px_rgba(0,245,255,0.4)] flex items-center justify-center transition-transform active:scale-95">
        <div class="w-full h-full bg-[#0A0F1D] rounded-full flex items-center justify-center">
          <svg id="micIcon" class="w-7 h-7 text-[#00F5FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
          </svg>
        </div>
      </button>
    </div>

  </div>

  <script>
    // App State
    let currentVoiceState = 'IDLE'; // IDLE, LISTENING, THINKING, SPEAKING, ERROR
    let recognition = null;
    let selectedLang = 'en-US';
    let audioLevel = 0.2;
    let flashlightOn = false;
    let batteryLevel = 98;
    
    // Sample Memories
    let memories = [
      { id: '1', key: 'Coffee', value: 'Oat milk latte without sugar', cat: 'PREFERENCE' },
      { id: '2', key: 'Wake Up Time', value: '7:00 AM daily', cat: 'ROUTINE' },
      { id: '3', key: 'Language', value: 'English, Kannada, Hindi', cat: 'PREFERENCE' }
    ];

    let historyItems = [
      { prompt: "Turn on flashlight", reply: "Flashlight turned on.", time: "10:14 AM" },
      { prompt: "What's my battery level?", reply: "Battery is at 98% (Discharging).", time: "10:12 AM" }
    ];

    // Clock
    setInterval(() => {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('statusBarTime').innerText = timeStr;
    }, 1000);

    // Orb Canvas Render Loop
    function renderOrb(canvasId, state) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const time = Date.now() * 0.003;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const baseR = 65;

      ctx.clearRect(0, 0, w, h);

      if (state === 'IDLE') {
        const r = baseR + Math.sin(time) * 4;
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.3, '#00F5FF');
        grad.addColorStop(0.8, '#9D4EDD');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Slow outer arc
        ctx.strokeStyle = 'rgba(0, 245, 255, 0.4)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 15, time * 0.4, time * 0.4 + 2.5);
        ctx.stroke();
      } else if (state === 'LISTENING') {
        const r = baseR + (audioLevel * 30);
        // Concentric shockwaves
        for (let i = 0; i < 3; i++) {
          const waveR = (baseR + (time * 25 + i * 25) % 45);
          ctx.strokeStyle = `rgba(0, 245, 255, ${Math.max(0, 1 - waveR / 110)})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, cy, waveR, 0, Math.PI * 2);
          ctx.stroke();
        }
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.5, '#00F5FF');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (state === 'THINKING') {
        // Dual swirling rings
        const r = baseR * 0.85;
        const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.6, '#9D4EDD');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Ring 1 Cyan
        ctx.strokeStyle = '#00F5FF';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 12, time * 2, time * 2 + 4);
        ctx.stroke();

        // Ring 2 Violet
        ctx.strokeStyle = '#9D4EDD';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 20, -time * 2.5, -time * 2.5 + 3.5);
        ctx.stroke();
      } else if (state === 'SPEAKING') {
        const r = baseR + Math.sin(time * 3) * 8;
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.4, '#9D4EDD');
        grad.addColorStop(0.9, '#3A86FF');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Speech harmonic wave
        ctx.strokeStyle = '#00F5FF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 16, time, time + 2);
        ctx.stroke();
      }
    }

    // Waveform Animation Loop
    function renderWaveform(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const bars = 24;
      const barW = w / (bars * 1.5);
      const gap = barW * 0.5;
      const time = Date.now() * 0.005;

      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#00F5FF');
      grad.addColorStop(1, '#9D4EDD');
      ctx.fillStyle = grad;

      for (let i = 0; i < bars; i++) {
        const sinVal = (Math.sin(time + i * 0.4) + 1) / 2;
        const barH = Math.max(3, sinVal * h * (currentVoiceState === 'LISTENING' || currentVoiceState === 'SPEAKING' ? 0.9 : 0.25));
        const x = i * (barW + gap) + 10;
        const y = (h - barH) / 2;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, barH, 4);
        ctx.fill();
      }
    }

    function mainAnimationLoop() {
      renderOrb('orbCanvas', currentVoiceState);
      renderOrb('voiceOrbCanvas', currentVoiceState);
      renderWaveform('waveCanvas');
      renderWaveform('voiceWaveCanvas');
      requestAnimationFrame(mainAnimationLoop);
    }
    requestAnimationFrame(mainAnimationLoop);

    // Navigation
    function switchScreen(screenId) {
      ['screenHome', 'screenVoice', 'screenMemory', 'screenHistory', 'screenSettings'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('flex');
      }
      if (screenId === 'screenMemory') renderMemoryList();
      if (screenId === 'screenHistory') renderHistoryList();
    }

    // Voice Engine
    function triggerVoiceSession() {
      switchScreen('screenVoice');
      currentVoiceState = 'LISTENING';
      document.getElementById('voiceStatusTitle').innerText = 'Listening...';
      document.getElementById('voiceTranscript').innerText = 'Speak now...';
      document.getElementById('voiceToolBadge').classList.add('hidden');

      // Use Web Speech API if supported
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = selectedLang;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
          const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
          document.getElementById('voiceTranscript').innerText = `"${transcript}"`;
          audioLevel = 0.8;
        };

        recognition.onend = () => {
          const finalPrompt = document.getElementById('voiceTranscript').innerText.replace(/"/g, '').trim();
          if (finalPrompt && finalPrompt !== 'Speak now...' && finalPrompt !== 'Listening to your voice...') {
            processAssistantTurn(finalPrompt);
          } else {
            currentVoiceState = 'IDLE';
            document.getElementById('voiceStatusTitle').innerText = 'Ready';
          }
        };

        recognition.onerror = () => {
          processAssistantTurn("What's my battery level?");
        };

        try { recognition.start(); } catch(e) {}
      } else {
        // Fallback simulated voice
        setTimeout(() => {
          document.getElementById('voiceTranscript').innerText = '"Turn on flashlight"';
          setTimeout(() => processAssistantTurn("Turn on flashlight"), 600);
        }, 1200);
      }
    }

    function processAssistantTurn(prompt) {
      currentVoiceState = 'THINKING';
      document.getElementById('voiceStatusTitle').innerText = 'DOKI is thinking...';

      setTimeout(() => {
        let reply = "";
        let toolName = null;
        const lower = prompt.toLowerCase();

        if (lower.includes('flashlight') || lower.includes('light')) {
          flashlightOn = !flashlightOn;
          toolName = 'toggle_flashlight';
          reply = flashlightOn ? "Flashlight is now turned on." : "Flashlight turned off.";
        } else if (lower.includes('battery')) {
          toolName = 'get_battery';
          reply = `Your battery is at ${batteryLevel}% (Discharging normally).`;
        } else if (lower.includes('alarm')) {
          toolName = 'create_alarm';
          reply = "I've set your alarm for 7:00 AM tomorrow.";
        } else if (lower.includes('ಹಲೋ') || lower.includes('ಡೋಕಿ') || lower.includes('ಕನ್ನಡ')) {
          reply = "ನಮಸ್ಕಾರ! ನಾನು ಡೋಕಿ, ನಿಮ್ಮ ವೈಯಕ್ತಿಕ ಸಹಾಯಕ. ನಾನು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?";
        } else if (lower.includes('नमस्ते') || lower.includes('डोकी') || lower.includes('हिंदी')) {
          reply = "नमस्ते! मैं डोकी हूँ। मैं आपके फ़ोन के सभी काम आसानी से कर सकता हूँ।";
        } else if (lower.includes('whatsapp') || lower.includes('message')) {
          toolName = 'send_whatsapp';
          reply = "Opening WhatsApp to send your message.";
        } else {
          reply = `I processed your request: "${prompt}". Ready for your next command.`;
        }

        document.getElementById('voiceResponseText').innerText = reply;
        if (toolName) {
          const badge = document.getElementById('voiceToolBadge');
          badge.innerText = `✓ Native Android Tool Executed: ${toolName}`;
          badge.classList.remove('hidden');
        }

        historyItems.unshift({ prompt: prompt, reply: reply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });

        // Speak response using browser TextToSpeech
        currentVoiceState = 'SPEAKING';
        document.getElementById('voiceStatusTitle').innerText = 'DOKI is speaking...';

        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(reply);
          utter.rate = 1.0;
          utter.pitch = 1.0;
          utter.onend = () => {
            currentVoiceState = 'IDLE';
            document.getElementById('voiceStatusTitle').innerText = 'Ready';
          };
          window.speechSynthesis.speak(utter);
        } else {
          setTimeout(() => {
            currentVoiceState = 'IDLE';
            document.getElementById('voiceStatusTitle').innerText = 'Ready';
          }, 2500);
        }
      }, 900);
    }

    function handleQuickPrompt(text) {
      document.getElementById('textInput').value = text;
      submitTextInput();
    }

    function submitTextInput() {
      const input = document.getElementById('textInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      switchScreen('screenVoice');
      document.getElementById('voiceTranscript').innerText = `"${val}"`;
      processAssistantTurn(val);
    }

    function renderMemoryList() {
      const list = document.getElementById('memoryList');
      list.innerHTML = memories.map(m => `
        <div class="glass-card p-3 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-purple-400 bg-purple-900/30 px-2 py-0.5 rounded">${m.cat}</span>
            <span class="font-bold text-white text-xs">${m.key}</span>
          </div>
          <p class="text-xs text-slate-300 mt-1">${m.value}</p>
        </div>
      `).join('');
    }

    function addSampleMemory() {
      const key = prompt("Enter Memory Key (e.g. Favorite Food):");
      const val = prompt("Enter Detail to Remember:");
      if (key && val) {
        memories.unshift({ id: Date.now().toString(), key, value: val, cat: 'PREFERENCE' });
        renderMemoryList();
      }
    }

    function renderHistoryList() {
      const list = document.getElementById('historyList');
      list.innerHTML = historyItems.map(h => `
        <div class="glass-card p-3 rounded-xl border border-slate-800">
          <div class="text-[10px] text-cyan-400 font-mono">${h.time}</div>
          <div class="font-semibold text-xs text-white mt-0.5">"${h.prompt}"</div>
          <p class="text-xs text-slate-300 mt-1">DOKI: ${h.reply}</p>
        </div>
      `).join('');
    }

    function clearHistory() {
      historyItems = [];
      renderHistoryList();
    }

    function saveLanguage() {
      selectedLang = document.getElementById('prefLang').value;
    }
  </script>
</body>
</html>
